train_stage: sort

paths:
  out_basedir: "src/tmp"

features:
  sparse_feature_names:
    - user_id
    - item_id
    - category
    - subcategory
    - user_click_category

  dense_feature_names: []

  array_feature_names:
    - user_history
    - user_history_clicked_category
    - user_history_clicked_subcategory
    # - item_title_entity_id
    # - user_history_title_entity_id
    # - user_history_abstract_entity_type
    # - user_history_title_entity_type
    # - item_title_entity_type
    # - item_abstract_entity_type

  item_feature_names:
    - item_id
    - category
    - subcategory
    # - item_title_entity_id

  user_feature_names:
    - user_id
    - user_click_category
    - user_history
    - user_history_clicked_category
    - user_history_clicked_subcategory
    # - user_history_title_entity_id

  array_max_length:
    user_history: 50
    user_history_clicked_category: 50
    user_history_clicked_subcategory: 50
    item_title_entity_id: 10
    user_history_title_entity_id: 100
    # user_history_abstract_entity_type: 200
    # user_history_title_entity_type: 200
    # item_title_entity_type: 10
    # item_abstract_entity_type: 10

embeddings:
  embedding_table_size:
    user_id: 94058
    item_id: 65239
    category: 20
    subcategory: 271
    user_click_category: 20
    item_title_entity_id: -1
    user_history_title_entity_id: -1

  embedding_tables:
    base_embedding_table:
      embedding_dims:
        user_id: 32 # 16
        item_id: 32
        category: 16
        subcategory: 16
        user_click_category: 16
        item_title_entity_id: 100
        user_history_title_entity_id: 100
      share_emb_table_features:
        user_history: item_id
        # user_click_category: category
        user_history_clicked_category: category
        user_history_clicked_subcategory: subcategory
        # item_abstract_entity_id: 100
        # item_title_entity_id: 100
        user_history_title_entity_id: item_title_entity_id
      pretrain_embedding:
        # item_abstract_entity_id: "/data2/zhy/News_Recsys/pretrain_embedding/abstract_entity_embedding.ckpt"
        item_title_entity_id: "/data2/zhy/News_Recsys/pretrain_embedding/title_entity_embedding.ckpt"

dataset:
  batch_size: 512
  num_workers: 4
  pin_memory: true
  only_test_warm_up_user: false
  load_npz: true


train_hparams:
  val_freq: 0.5
  max_epoch: 40
  lr: 1.0e-3
  min_lr: 5.0e-6
  lr_milestones:
    - 40000
    - 200000
  max_step: 300000
  device: "gpu"
  gpus:
    - 0

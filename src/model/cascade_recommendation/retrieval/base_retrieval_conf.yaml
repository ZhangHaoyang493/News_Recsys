train_stage: retrieval

paths:
  out_basedir: "src/tmp"

features:
  sparse_feature_names:
    - user_id
    - item_id
    - category
    - subcategory
    - user_click_category
    - impression_id
    # - item_abstract_entity_type
    # - item_title_entity_type

  dense_feature_names: []

  array_feature_names:
    - user_history
    - user_history_clicked_category
    - user_history_clicked_subcategory
    # - item_abstract_entity_type
    # - item_title_entity_type

  item_feature_names:
    - item_id
    - category
    - subcategory
    # - item_abstract_entity_type
    # - item_title_entity_type

  user_feature_names:
    - user_id
    - user_click_category
    # - user_history
    - user_history_clicked_category
    - user_history_clicked_subcategory

    

  array_max_length:
    user_history: 150
    user_history_clicked_category: 150
    user_history_clicked_subcategory: 150
    item_abstract_entity_type: 10
    item_title_entity_type: 10


embeddings:
  embedding_table_size:
    user_id: 94058
    item_id: 65239
    category: 20
    subcategory: 271
    user_click_category: 19
    # item_abstract_entity_type: 23
    # item_title_entity_type: 23

  embedding_tables:
    base_embedding_table:
      embedding_dims:
        user_id: 32 # 16
        item_id: 32
        category: 16
        subcategory: 16
        user_click_category: 16
        # item_abstract_entity_type: 16
        # item_title_entity_type: 16
      share_emb_table_features: 
        user_history: item_id
        user_click_category: category
        user_history_clicked_category: category
        user_history_clicked_subcategory: subcategory

dataset:
  batch_size: 512
  num_workers: 4
  pin_memory: true
  only_test_warm_up_user: true


train_hparams:
  val_freq: 1.0
  max_epoch: 100
  lr: 1.0e-3
  min_lr: 5.0e-6
  lr_milestones:
    - 40000
    - 200000
  max_step: 300000
  device: "gpu"
  gpus:
    - 2
  negative_sample_rate: 1
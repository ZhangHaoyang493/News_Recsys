train_stage: sort

paths:
  out_basedir: "src/tmp"

features:
  sparse_feature_names:
    - user_id
    - item_id
    - category
    - subcategory
    - user_click_category

  dense_feature_names: []

  array_feature_names: []

  item_feature_names:
    - item_id
    - category
    - subcategory

  user_feature_names:
    - user_id
    - user_click_category

  array_max_length: {}

embeddings:
  embedding_table_size:
    user_id: 94058
    item_id: 65239
    category: 19
    subcategory: 270
    user_click_category: 18

  embedding_tables:
    base_embedding_table:
      embedding_dims:
        user_id: 32 # 16
        item_id: 32
        category: 16
        subcategory: 16
        user_click_category: 16
      share_emb_table_features: {}

dataset:
  batch_size: 512
  num_workers: 4
  pin_memory: true
  only_test_warm_up_user: true


train_hparams:
  val_freq: 0.5
  max_epoch: 20
  lr: 1.0e-3
  min_lr: 5.0e-6
  lr_milestones:
    - 40000
    - 200000
  max_step: 300000
  device: "gpu"
  gpus:
    - 2
paths:
  data_path: "Data/MIND"
  out_basedir: "src/tmp"
  feature_extractor_path: "./feature_extractor.py"
  user_history_path: "/data2/zhy/Movie_Recsys/Data/MovieLens_1M_data/user_history.json"

features:
  feature_names:
    - user_id
    - item_id
    - category
    - subcategory
    - user_click_category
    - user_history
    - impression_id
    - user_history_clicked_category
    - user_history_clicked_subcategory
    - item_abstract_entity_type
    - item_title_entity_type
    - item_abstract_entity_vector
    - item_title_entity_vector
  
  item_feature_names:
    - item_id
    - category
    - subcategory
    - item_abstract_entity_type
    - item_title_entity_type
    - item_abstract_entity_vector
    - item_title_entity_vector
  
  array_feature_names: 
    - user_history
    - user_history_clicked_category
    - user_history_clicked_subcategory
    - item_abstract_entity_type
    - item_title_entity_type

  vector_feature_names:
    - item_abstract_entity_vector
    - item_title_entity_vector

  share_emb_table_features: # 共享embedding表的特征名称
    user_history: item_id
    user_click_category: category
    user_history_clicked_category: category
    user_history_clicked_subcategory: subcategory

  array_max_length:
    user_history: 100
    user_history_clicked_category: 100
    user_history_clicked_subcategory: 100
    item_abstract_entity_type: 10
    item_title_entity_type: 10